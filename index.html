<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>爪爪匣 · PinkPaw</title>
<style>
:root{
  --bg:#fff5f8;--bg2:#ffe9f1;--card:#ffffff;
  --ink:#5b3a48;--ink2:#a97e91;--line:#ffd6e5;
  --accent:#ff8fb8;--accent2:#ffb6d0;
  --shadow:0 6px 18px rgba(255,143,184,.18);
}
html[data-theme="night"]{
  --bg:#2a1c24;--bg2:#3a2530;--card:#3d2733;
  --ink:#ffe6ef;--ink2:#d9a9bd;--line:#5b3a4a;
  --accent:#ff8fb8;--accent2:#ff6fa3;
  --shadow:0 6px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,var(--bg),var(--bg2));
  color:var(--ink);min-height:100vh;padding:18px 16px 60px;
  transition:background .35s,color .35s;
}
header{max-width:960px;margin:0 auto 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.title{font-size:24px;font-weight:800;letter-spacing:1px;user-select:none}
.title small{display:block;font-size:10px;font-weight:400;color:var(--ink2);letter-spacing:3px;margin-top:2px}
.paw{font-size:26px;margin-right:6px}
.iconbtn{
  border:none;background:var(--card);color:var(--ink);
  width:40px;height:40px;border-radius:50%;font-size:17px;cursor:pointer;
  box-shadow:var(--shadow);
}
.wrap{max-width:960px;margin:0 auto}
#search{
  width:100%;padding:12px 18px;border-radius:16px;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);font-size:15px;outline:none;box-shadow:var(--shadow);
  margin-bottom:12px;
}
#search::placeholder{color:var(--ink2)}
#search:focus{border-color:var(--accent)}

.cats{display:flex;gap:10px;margin-bottom:10px}
.cat{
  flex:1;text-align:center;padding:10px 8px;border-radius:16px;cursor:pointer;
  background:var(--card);border:1.5px solid var(--line);color:var(--ink2);
  font-size:14.5px;font-weight:700;transition:.2s;user-select:none;box-shadow:var(--shadow);
}
.cat:hover{border-color:var(--accent2)}
.cat.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.cat small{display:block;font-size:10.5px;font-weight:400;opacity:.75;margin-top:2px}

.subs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;min-height:34px}
.sub-tag{
  padding:6px 14px;border-radius:999px;font-size:13px;cursor:pointer;
  background:var(--card);color:var(--ink2);border:1.5px solid var(--line);
  transition:.2s;user-select:none;
}
.sub-tag:hover{border-color:var(--accent2)}
.sub-tag.on{background:var(--accent);color:#fff;border-color:var(--accent)}

.count{font-size:11.5px;color:var(--ink2);margin-bottom:10px;letter-spacing:.5px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{
  background:var(--card);border-radius:18px;padding:16px 16px 14px;
  box-shadow:var(--shadow);border:1.5px solid transparent;
  transition:.22s;display:block;text-decoration:none;color:inherit;
}
.card:hover{transform:translateY(-3px);border-color:var(--accent2)}
.card .name{font-size:16px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.card .name span.arrow{font-size:12px;color:var(--ink2)}
.card .note{font-size:12.5px;color:var(--ink2);line-height:1.55;margin-bottom:10px;min-height:18px}
.card .foot{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--bg2);color:var(--ink2)}
.chip.sign{background:var(--accent);color:#fff}
.empty{text-align:center;color:var(--ink2);padding:50px 0;font-size:14px}
footer{max-width:960px;margin:26px auto 0;text-align:center;font-size:11.5px;color:var(--ink2);letter-spacing:1px;line-height:1.9}
</style>
</head>
<body>
<header>
  <div class="title"><span class="paw">🐾</span>爪爪匣<small>PINKPAW</small></div>
  <button class="iconbtn" id="themeBtn" title="换个颜色">🌙</button>
</header>

<div class="wrap">
  <div class="cats" id="cats"></div>
  <input id="search" placeholder="搜一搜，爪爪里有什么…">
  <div class="subs" id="subs"></div>
  <div class="count" id="count"></div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">这里空空的，什么都没有喵。</div>
</div>

<footer>爪爪匣 · 拿来就能用</footer>

<script src="./data.js"></script>
<script>
const DATA = (typeof PAW_DATA !== "undefined" ? PAW_DATA : []);
const CATS = [
  {key:"付费", desc:"要花钱的"},
  {key:"公益", desc:"白给的"}
];
const SUBS = ["全部","可签到","不可签到"];

let curCat = "付费";
let curSub = "全部";

const $grid=document.getElementById("grid"),$cats=document.getElementById("cats"),
      $subs=document.getElementById("subs"),$empty=document.getElementById("empty"),
      $count=document.getElementById("count"),$search=document.getElementById("search");

function esc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&#38;")
    .replace(/</g,"&#60;")
    .replace(/>/g,"&#62;")
    .replace(/"/g,"&#34;");
}

function renderCats(){
  $cats.innerHTML="";
  CATS.forEach(c=>{
    const n=DATA.filter(d=>d.cat===c.key).length;
    const el=document.createElement("div");
    el.className="cat"+(c.key===curCat?" on":"");
    el.innerHTML=esc(c.key)+"站<small>"+esc(c.desc)+" · "+n+"</small>";
    el.onclick=()=>{curCat=c.key;curSub="全部";renderCats();renderSubs();render();};
    $cats.appendChild(el);
  });
}
function renderSubs(){
  $subs.innerHTML="";
  SUBS.forEach(s=>{
    const el=document.createElement("div");
    el.className="sub-tag"+(s===curSub?" on":"");
    el.textContent=s;
    el.onclick=()=>{curSub=s;renderSubs();render();};
    $subs.appendChild(el);
  });
}
function render(){
  const kw=$search.value.trim().toLowerCase();
  const list=DATA.filter(d=>{
    const text=(d.name+(d.note||"")+(d.cat||"")+(d.sign||"")).toLowerCase();
    if(kw) return text.includes(kw);
    if(curCat!==(d.cat||"")) return false;
    if(curSub!=="全部" && (d.sign||"")!==curSub) return false;
    return true;
  });
  $grid.innerHTML="";
  $empty.style.display=list.length?"none":"block";
  $count.textContent=list.length?("共 "+list.length+" 个站"):"";
  list.forEach(d=>{
    const a=document.createElement("a");
    a.className="card";
    a.href=d.url;a.target="_blank";a.rel="noopener noreferrer";
    const chips=[];
    if(d.sign) chips.push("<span class=\"chip sign\">"+esc(d.sign)+"</span>");
    chips.push("<span class=\"chip\">"+esc(d.cat)+"站</span>");
    a.innerHTML="<div class=\"name\">"+esc(d.name)+"<span class=\"arrow\">↗</span></div>"+
      "<div class=\"note\">"+(esc(d.note)||"&#160;")+"</div><div class=\"foot\">"+chips.join("")+"</div>";
    $grid.appendChild(a);
  });
}
$search.addEventListener("input",render);

const themeBtn=document.getElementById("themeBtn");
themeBtn.onclick=()=>{
  const now=document.documentElement.getAttribute("data-theme");
  const next=now==="night"?"day":"night";
  document.documentElement.setAttribute("data-theme",next);
  themeBtn.textContent=next==="night"?"☀️":"🌙";
  localStorage.setItem("pinkpaw-theme",next);
};
if(localStorage.getItem("pinkpaw-theme")==="night"){
  document.documentElement.setAttribute("data-theme","night");
  themeBtn.textContent="☀️";
}

renderCats();renderSubs();render();
</script>
</body>
</html>
