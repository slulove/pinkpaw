<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>爪爪匣 · 管理台</title>
<style>
:root{
  --bg:#fff5f8;--bg2:#ffe9f1;--card:#ffffff;
  --ink:#5b3a48;--ink2:#a97e91;--line:#ffd6e5;
  --accent:#ff8fb8;--accent2:#ffb6d0;
  --shadow:0 6px 18px rgba(255,143,184,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,var(--bg),var(--bg2));
  color:var(--ink);min-height:100vh;padding:22px 16px 60px;
}
header{max-width:720px;margin:0 auto 16px}
.title{font-size:22px;font-weight:800;letter-spacing:1px}
.title small{display:block;font-size:11px;font-weight:400;color:var(--ink2);letter-spacing:2px;margin-top:2px}
.panel{
  max-width:720px;margin:0 auto;background:var(--card);border-radius:20px;
  padding:20px;box-shadow:var(--shadow);
}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.row input,.row textarea,.row select{
  flex:1;min-width:120px;padding:10px 12px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--bg);color:var(--ink);
  font-size:13.5px;outline:none;font-family:inherit;
}
.row textarea{min-height:50px;resize:vertical}
.row input:focus,.row textarea:focus,.row select:focus{border-color:var(--accent)}
.row select{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.btn{
  border:none;background:var(--accent);color:#fff;border-radius:12px;
  padding:10px 16px;font-size:13.5px;cursor:pointer;font-weight:600;
}
.btn.ghost{background:var(--bg2);color:var(--ink)}
.btn.warn{background:#ff9aa2}
.list{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.item{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:10px 0;border-bottom:1px dashed var(--line);font-size:13.5px;
}
.item .meta{color:var(--ink2);font-size:11.5px;word-break:break-all;margin-top:3px}
.item .ops{display:flex;gap:6px;flex-shrink:0}
.item .ops button{border:none;background:var(--bg2);color:var(--ink);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
.item .ops .up{background:#d8f0ff}
.out{
  width:100%;min-height:220px;margin-top:14px;padding:12px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--bg);color:var(--ink);
  font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.6;resize:vertical;
}
.hint{font-size:11.5px;color:var(--ink2);margin:8px 0 0;line-height:1.7}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stat{font-size:12px;color:var(--ink2);margin-bottom:12px}
</style>
</head>
<body>
<header>
  <div class="title">🐾 爪爪匣 · 管理台<small>LOCAL ADMIN</small></div>
</header>

<div class="panel">
  <div class="stat" id="stat">还没有站点</div>

  <div class="row">
    <input id="f-name" placeholder="站点名称">
    <input id="f-url" placeholder="链接（填你自己的邀请链接）">
  </div>
  <div class="row">
    <select id="f-cat">
      <option value="付费">付费站</option>
      <option value="公益">公益站</option>
    </select>
    <select id="f-sign">
      <option value="可签到">可签到</option>
      <option value="不可签到">不可签到</option>
    </select>
  </div>
  <div class="row">
    <input id="f-note" placeholder="一句话备注">
  </div>
  <div class="row">
    <button class="btn" id="addBtn">添加 / 保存修改</button>
    <button class="btn ghost" id="cancelEdit">取消编辑</button>
  </div>

  <div class="list" id="list"></div>

  <div class="bar">
    <button class="btn" id="genBtn">生成 data.js</button>
    <button class="btn ghost" id="copyBtn">复制</button>
    <button class="btn ghost" id="expBtn">导出备份</button>
    <button class="btn ghost" id="impBtn">导入备份</button>
    <button class="btn warn" id="clearBtn">清空全部</button>
  </div>
  <div class="row" style="margin-top:10px;align-items:center">
    <label style="font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px">
      <input type="checkbox" id="autoChk" checked style="flex:none;width:16px;height:16px">
      停手一分半后自动存一份备份到你手机的下载目录（同名覆盖，只留最新一份）
    </label>
  </div>
  <input type="file" id="fileInput" accept=".json" style="display:none">
  <textarea class="out" id="out" spellcheck="false" placeholder="点「生成 data.js」，把这里的内容整段复制走。"></textarea>
  <p class="hint">
    选好分类和签到情况就不用管标签了。改完点「生成 data.js」，
    整段复制，去 GitHub 打开 data.js 覆盖提交，网站自己就更新了。
  </p>
</div>

<script>
const KEY="pinkpaw-admin-v2";
let DATA=load();
let editingIndex=-1;

let autoOn=true,lastChange=0,lastBackup=0,dirty=false;
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}return [];}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(DATA));}catch(e){}
  dirty=true;lastChange=Date.now();
}
setInterval(()=>{
  if(!autoOn||!dirty||!DATA.length)return;
  const now=Date.now();
  if(now-lastChange>=90000||now-lastBackup>=300000){autoBackup();}
},15000);
function autoBackup(){
  try{
    const s=JSON.stringify(DATA,null,2);
    const blob=new Blob([s],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="pinkpaw-备份-"+DATA.length+"站.json";
    a.click();
    dirty=false;lastBackup=Date.now();
  }catch(e){}
}

const $list=document.getElementById("list"),$out=document.getElementById("out"),
      $stat=document.getElementById("stat");
const F=id=>document.getElementById(id);

function syncSign(){}

function render(){
  const paid=DATA.filter(d=>d.cat==="付费").length;
  const pub=DATA.filter(d=>d.cat==="公益").length;
  $stat.textContent=`共 ${DATA.length} 个站 · 付费 ${paid} · 公益 ${pub}`;
  $list.innerHTML="";
  if(!DATA.length){$list.innerHTML='<p class="hint">还没有站点。上面填一条加进来。</p>';return;}
  DATA.forEach((d,i)=>{
    const el=document.createElement("div");
    el.className="item";
    el.innerHTML=`<div style="flex:1;min-width:0">
        <div>${d.name}</div>
        <div class="meta">${d.cat}${d.sign?" · "+d.sign:""} · ${d.url}</div>
      </div>
      <div class="ops">
        <button class="up" data-up="${i}">↑</button>
        <button data-edit="${i}">改</button>
        <button data-del="${i}">删</button>
      </div>`;
    $list.appendChild(el);
  });
  $list.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>startEdit(+b.dataset.edit));
  $list.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{DATA.splice(+b.dataset.del,1);save();render();});
  $list.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.up;if(i===0)return;
    [DATA[i-1],DATA[i]]=[DATA[i],DATA[i-1]];save();render();
  });
}
function startEdit(i){
  const d=DATA[i];
  F("f-name").value=d.name;F("f-url").value=d.url;
  F("f-note").value=d.note||"";
  F("f-cat").value=d.cat||"付费";
  F("f-sign").value=d.sign||"可签到";
  syncSign();
  editingIndex=i;window.scrollTo(0,0);
}
F("cancelEdit").onclick=()=>{editingIndex=-1;["f-name","f-url","f-note"].forEach(id=>F(id).value="");};
F("addBtn").onclick=()=>{
  const name=F("f-name").value.trim(),url=F("f-url").value.trim();
  if(!name||!url){alert("名称和链接不能空");return;}
  const cat=F("f-cat").value;
  const obj={name,url,note:F("f-note").value.trim(),cat,
    sign:F("f-sign").value};
  if(editingIndex>=0){DATA[editingIndex]=obj;editingIndex=-1;}else DATA.push(obj);
  save();render();
  ["f-name","f-url","f-note"].forEach(id=>F(id).value="");
};
F("clearBtn").onclick=()=>{if(confirm("清空全部？")){DATA=[];save();render();}};

F("genBtn").onclick=()=>{
  const body=DATA.map(d=>{
    return `  {\n    name: ${JSON.stringify(d.name)},\n    url: ${JSON.stringify(d.url)},\n    note: ${JSON.stringify(d.note||"")},\n    cat: ${JSON.stringify(d.cat||"付费")},\n    sign: ${JSON.stringify(d.sign||"")}\n  }`;
  }).join(",\n");
  $out.value=`/* 爪爪匣 · 数据文件。整段复制去 GitHub 的 data.js 覆盖提交。 */\n\nconst PAW_DATA = [\n${body}\n];\n`;
};
F("copyBtn").onclick=async()=>{
  if(!$out.value){F("genBtn").click();}
  try{await navigator.clipboard.writeText($out.value);}
  catch(e){$out.select();document.execCommand("copy");}
  alert("已复制");
};
F("expBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(DATA,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="pinkpaw-backup.json";a.click();
};
F("impBtn").onclick=()=>F("fileInput").click();
F("fileInput").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{DATA=JSON.parse(r.result);save();render();alert("导入成功 "+DATA.length+" 条");}catch(err){alert("格式不对");}};
  r.readAsText(f);
};

syncSign();
F("autoChk").checked=autoOn;
F("autoChk").onchange=()=>{autoOn=F("autoChk").checked;};
render();
</script>
</body>
</html>
